services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xcapital-postgres
    restart: always
    environment:
      POSTGRES_USER: xcapital
      POSTGRES_PASSWORD: xcapital_prod_secure_password_2026
      POSTGRES_DB: xcapital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcapital -d xcapital_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: xcapital-redis
    restart: always
    command: redis-server --requirepass xcapital_redis_secure_2026
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: xcapital-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://xcapital:[REDACTED]@postgres:5432/xcapital_db
      REDIS_URL: redis://:[REDACTED]@redis:6379
      JWT_SECRET: xcapital_jwt_secret_production_key_2026_minimum_64_chars_here
      FRONTEND_URL: https://xcapital.investments
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: xcapital-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://xcapital.investments/api/v1
      NEXT_PUBLIC_WS_URL: wss://xcapital.investments
      NEXT_PUBLIC_FINNHUB_API_KEY: d7damlhr01qggoenll90d7damlhr01qggoenll9g
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ─── AI Oracle Service ──────────────────────────────────────────────────────
  ai-oracle:
    build: ./ai-oracle
    container_name: xcapital-oracle
    restart: always
    environment:
      PORT: 8000
      ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./ai-oracle:/app

volumes:
  postgres_data:
