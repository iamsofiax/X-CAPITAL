# X-CAPITAL — Render Blueprint
# New → Blueprint → iamsofiax/X-CAPITAL → Apply

databases:
  - name: xcapital-db
    databaseName: xcapital_db
    user: xcapital
    plan: free

services:
  - type: web
    name: xcapital-oracle
    runtime: python
    rootDir: ai-oracle
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_ORIGINS
        value: https://xcapital-api.onrender.com,https://xcapital.investments,http://localhost:4000

  - type: web
    name: xcapital-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: xcapital-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://xcapital.investments
      - key: CORS_ORIGINS
        value: https://xcapital-web.onrender.com
      - key: AI_ORACLE_URL
        fromService:
          type: web
          name: xcapital-oracle
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALPACA_API_KEY
        value: ""
      - key: ALPACA_SECRET_KEY
        value: ""
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets

  - type: web
    name: xcapital-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.xcapital.investments/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://api.xcapital.investments
